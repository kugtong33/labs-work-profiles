name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bats test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/work-profile-tests" --ignore-scripts --no-audit --no-fund bats@1.13.0
          echo "$RUNNER_TEMP/work-profile-tests/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check syntax and run isolated integration and regression tests
        run: make check test
